{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    .row-modified { background: #fff3cd; }
    .cell-changed { outline: 2px dashed #0d6efd; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">AR Portal</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/maps/">Catalog</a></li>
        <li class="nav-item"><a class="nav-link" href="/maps/list/">Rows</a></li>
        <li class="nav-item"><a class="nav-link" href="/maps/upload/">Upload</a></li>
        <li class="nav-item"><a class="nav-link" href="/maps/approvals/">Approvals</a></li>
      </ul>
      <ul class="navbar-nav">
        {% if user.is_authenticated %}
        <li class="nav-item"><span class="navbar-text me-2">Hi {{ user.username }}</span></li>
        <li class="nav-item"><a class="nav-link" href="/accounts/logout/">Logout</a></li>
        {% else %}
        <li class="nav-item"><a class="nav-link" href="/accounts/login/">Login</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
<div class="container">
  {% for m in messages %}
    <div class="alert alert-{{ m.tags }}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script>
  // Attach CSRF token to all HTMX requests
  document.body.addEventListener('htmx:configRequest', (e) => {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    if (m) e.detail.headers['X-CSRFToken'] = m[1];
  });
</script>


</body>
</html>
