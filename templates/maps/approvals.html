{% extends "base.html" %}
{% block content %}
<h4>Pending Approvals</h4>
<table class="table table-striped table-sm">
  <thead><tr><th>ID</th><th>Map</th><th>Actor</th><th>Created</th><th></th></tr></thead>
  <tbody>
  {% for cr in items %}
    <tr>
      <td>{{ cr.id }}</td>
      <td>{{ cr.map_name }}</td>
      <td>{{ cr.actor }}</td>
      <td>{{ cr.created_at }}</td>
      <td><a class="btn btn-sm btn-primary" href="/maps/approvals/{{ cr.id }}/">Review</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="5">No pending items.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
