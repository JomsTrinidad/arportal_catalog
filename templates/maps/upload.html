{% extends "base.html" %}
{% block content %}
<h4>CSV Upload</h4>
<form method="post" enctype="multipart/form-data">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success">Upload</button>
</form>
<div class="mt-3">
  <p><strong>Note:</strong> Upload queues pending Change Requests for approval.</p>
</div>
{% endblock %}
